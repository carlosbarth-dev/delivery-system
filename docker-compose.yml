# Sistema de Delivery - Docker Compose Orchestration

#
# Executa a aplicação completa:
# - Backend FastAPI (porta 8000)
# - Frontend Vue.js (porta 5173)
# - MySQL (porta 3306)
#
# Uso:
#   docker-compose up           # Build + run
#   docker-compose down         # Parar
#   docker-compose logs -f      # Ver logs
#
# Acesso:
#   Frontend: http://localhost:5173
#   Backend: http://localhost:8000
#   Docs API: http://localhost:8000/docs

version: '3.9'

services:

  # ==========================================
  # MySQL
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: delivery-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: delivery_db
      MYSQL_USER: delivery_app
      MYSQL_PASSWORD: delivery_app_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    volumes:
      - delivery_mysql_data:/var/lib/mysql
    networks:
      - delivery-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_only"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://delivery_app:delivery_app_dev@mysql:3306/delivery_db
      - DEBUG=True
      - SECRET_KEY=dev-secret-docker
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000", "http://frontend:80"]
    volumes:
      # Hot reload em desenvolvimento
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - delivery-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================
  # Frontend App
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delivery-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      # Hot reload em desenvolvimento
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      - delivery-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ==========================================
# Network
# ==========================================
networks:
  delivery-network:
    driver: bridge

# ==========================================
# Volumes (persistência de dados)
# ==========================================
volumes:
  delivery_mysql_data: